  // ---------- Bulk JSON Import ----------
  var bulkState = { platform:'yt', fileName:'', data:null, errors:[], warnings:[], progress:0, phase:'' };

  function isValidDateString(value){
    if(typeof value!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    var p=value.split('-').map(Number), d=new Date(p[0],p[1]-1,p[2]);
    return d.getFullYear()===p[0] && d.getMonth()===p[1]-1 && d.getDate()===p[2];
  }

  function validateBulkJson(raw, platformKey){
    var result={items:[],errors:[],warnings:[]}, parsed;
    try{ parsed=JSON.parse(raw); }
    catch(e){ result.errors.push('Invalid JSON: '+(e.message||'Could not parse the file.')); return result; }
    if(!Array.isArray(parsed)){
      result.errors.push('The JSON root must be an array of posts.'); return result;
    }
    if(parsed.length===0){ result.errors.push('The JSON file contains no posts.'); return result; }
    var schema=schemaFor(platformKey), seen={};
    parsed.forEach(function(item,idx){
      var n=idx+1;
      if(!item || typeof item!=='object' || Array.isArray(item)){ result.errors.push('Row '+n+': each item must be an object.'); return; }
      if(!item.date) result.errors.push('Row '+n+': date is required.');
      else if(!isValidDateString(item.date)) result.errors.push('Row '+n+': date must be a real date in YYYY-MM-DD format.');
      if(!item.platform) result.errors.push('Row '+n+': platform is required.');
      else if(item.platform!==platformKey) result.errors.push('Row '+n+': platform must match the selected platform ('+platformKey+').');
      if(item.time!==undefined && item.time!==''){
        if(typeof item.time!=='string' || !/^([01]\d|2[0-3]):[0-5]\d$/.test(item.time)) result.errors.push('Row '+n+': time must use HH:MM (24-hour) format.');
      }
      schema.forEach(function(f){
        if(f.key==='contentType' && (item[f.key]===undefined || String(item[f.key]).trim()==='')){
          result.errors.push('Row '+n+': contentType is required.');
        }
        if(f.type==='select' && item[f.key]!==undefined && f.options.indexOf(item[f.key])===-1){
          result.errors.push('Row '+n+': '+f.key+' must be one of '+f.options.join(', ')+'.');
        }
        if(item[f.key]!==undefined && typeof item[f.key]!=='string') result.errors.push('Row '+n+': '+f.key+' must be text.');
      });
      var hasContent=schema.some(function(f){ return item[f.key]!==undefined && String(item[f.key]).trim()!==''; });
      if(!hasContent) result.errors.push('Row '+n+': at least one platform content field is required.');
      if(item.metrics!==undefined){
        if(!item.metrics || typeof item.metrics!=='object' || Array.isArray(item.metrics)) result.errors.push('Row '+n+': metrics must be an object.');
        else METRIC_FIELDS.forEach(function(m){
          if(item.metrics[m.key]!==undefined && item.metrics[m.key]!==null && (item.metrics[m.key]==='' || !Number.isFinite(Number(item.metrics[m.key])) || Number(item.metrics[m.key])<0)) result.errors.push('Row '+n+': '+m.key+' must be a non-negative number.');
        });
      }
      var sourceId=String(item.sourceId||item.id||'').trim();
      var permalink=String(item.permalink||item.permalink_url||'').trim();
      var duplicateKey=sourceId ? 'sourceId|'+sourceId : (permalink ? 'permalink|'+permalink : 'content|'+String(item.date||'')+'|'+platformKey+'|'+schema.map(function(f){return String(item[f.key]||'').trim();}).join('|'));
      if(seen[duplicateKey]) result.errors.push('Row '+n+': duplicate of row '+seen[duplicateKey]+'.');
      else seen[duplicateKey]=n;
      var payload={platform:platformKey,date:item.date,time:item.time||''};
      schema.forEach(function(f){ payload[f.key]=item[f.key]===undefined?'':String(item[f.key]); });
      if(sourceId) payload.sourceId=sourceId;
      if(permalink) payload.permalink=permalink;
      payload.metrics={}; METRIC_FIELDS.forEach(function(m){ payload.metrics[m.key]=(item.metrics&&item.metrics[m.key]!==undefined&&item.metrics[m.key]!==null&&item.metrics[m.key]!=='')?Number(item.metrics[m.key]):null; });
      payload.metricsUpdatedAt=null;
      result.items.push(payload);
    });
    // Existing-record duplicates are warnings, not hard errors, so import can still be intentional.
    result.items.forEach(function(item,idx){
      var incomingSourceId=String(item.sourceId||'').trim();
      var incomingPermalink=String(item.permalink||'').trim();
      var exists=state.posts.some(function(p){
        if(incomingSourceId && String(p.sourceId||'').trim()===incomingSourceId) return true;
        if(incomingPermalink && String(p.permalink||'').trim()===incomingPermalink) return true;
        if(p.platform!==item.platform || p.date!==item.date) return false;
        return schemaFor(item.platform).every(function(f){return String(p[f.key]||'').trim()===String(item[f.key]||'').trim();});
      });
      if(exists) result.warnings.push('Row '+(idx+1)+': an identical post already exists and will be skipped.');
    });
    if(result.errors.length) result.items=[];
    return result;
  }

  function bulkTemplate(platformKey){
    // Keep the displayed template fully valid against validateBulkJson().
    // The importer requires platform, date and the platform-specific schema fields.
    var example={
      platform:platformKey,
      date:'2026-10-01',
      time:'10:00'
    };
    schemaFor(platformKey).forEach(function(f){
      example[f.key]=f.type==='select'?f.options[0]:'Example content';
    });
    example.metrics={views:0,likes:0,comments:0};
    return JSON.stringify([example],null,2);
  }

  function openBulkImport(){
    bulkState={platform:'yt',fileName:'',data:null,errors:[],warnings:[],progress:0,phase:''};
    renderBulkModal(); bulkOverlay.classList.remove('hidden');
  }
  function closeBulkImport(){ bulkOverlay.classList.add('hidden'); bulkOverlay.innerHTML=''; }

  function renderBulkModal(){
    var result=bulkState.data;
    var plat=platform(bulkState.platform);
    var platformButtons=PLATFORMS.map(function(p){return '<button type="button" class="platform-pick-btn'+(bulkState.platform===p.key?' active':'')+'" data-action="bulk-platform" data-platform="'+p.key+'">'+p.name+'</button>';}).join('');
    var status='';
    if(bulkState.fileName && !result){
      var pct=Math.max(0,Math.min(100,Number(bulkState.progress)||0));
      status='<div class="bulk-progress"><div class="bulk-progress-head"><span>'+escapeHtml(bulkState.phase||'Reading file…')+'</span><span id="bulkProgressPct">'+pct+'%</span></div><div class="bulk-progress-track"><div id="bulkProgressBar" class="bulk-progress-bar" style="width:'+pct+'%"></div></div><div class="bulk-progress-meta">The file is read locally. Nothing is saved until validation succeeds.</div></div>';
    }
    if(result){
      if(result.errors.length){
        status='<div class="bulk-errors">'+result.errors.map(function(x){return '<div class="error">'+escapeHtml(x)+'</div>';}).join('')+'</div>';
      }else{
        status='<div class="bulk-ok"><strong>'+result.items.length+' posts ready to import.</strong> No validation errors found.</div>';
        if(result.warnings.length) status+='<div class="bulk-errors" style="margin-top:8px">'+result.warnings.map(function(x){return '<div class="error">'+escapeHtml(x)+'</div>';}).join('')+'</div>';
      }
      status='<div class="bulk-summary"><span class="bulk-stat"><strong>'+result.items.length+'</strong> valid</span><span class="bulk-stat"><strong>'+result.errors.length+'</strong> errors</span><span class="bulk-stat"><strong>'+result.warnings.length+'</strong> warnings</span></div>'+status;
    }
    var disabled=!(result && !result.errors.length && result.items.length);
    bulkOverlay.innerHTML='<div class="panel" role="dialog" aria-modal="true">'+
      '<h3>Bulk Import JSON</h3><div class="sub">Import multiple '+plat.name+' posts at once. Nothing is saved until validation passes.</div>'+
      '<label>Platform</label><div class="platform-picker">'+platformButtons+'</div>'+
      '<label>JSON file</label><label class="file-drop"><input id="bulkFileInput" type="file" accept="application/json,.json"><strong>Choose JSON file</strong><span>'+ (bulkState.fileName?escapeHtml(bulkState.fileName):'Expected: an array of post objects') +'</span></label>'+
      status+
      '<label>Expected format</label><div class="json-code">'+escapeHtml(bulkTemplate(bulkState.platform))+'</div>'+
      '<div class="panel-actions"><button type="button" class="btn-secondary" data-action="close-bulk">Cancel</button><div class="right"><button type="button" class="btn-primary" data-action="confirm-bulk" '+(disabled?'disabled style="opacity:.45;cursor:not-allowed"':'')+'>Import '+(result&&!result.errors.length?result.items.length:0)+' Posts</button></div></div>'+
      '</div>';
  }

  function readBulkFile(file){
    if(!file){return;}
    bulkState.fileName=file.name; bulkState.data=null; bulkState.progress=0; bulkState.phase='Reading file…';
    renderBulkModal();
    showToast('Reading JSON','Opening '+file.name+'…','info',2200);
    var reader=new FileReader();
    reader.onprogress=function(e){
      if(e.lengthComputable){
        var pct=Math.round((e.loaded/e.total)*80);
        bulkState.progress=pct; bulkState.phase='Reading file…';
        var bar=document.getElementById('bulkProgressBar'), label=document.getElementById('bulkProgressPct');
        if(bar) bar.style.width=pct+'%';
        if(label) label.textContent=pct+'%';
      }
    };
    reader.onload=function(e){
      bulkState.progress=85; bulkState.phase='Validating JSON…';
      var bar=document.getElementById('bulkProgressBar'), label=document.getElementById('bulkProgressPct');
      if(bar) bar.style.width='85%'; if(label) label.textContent='85%';
      // Let the browser paint the progress state before validating a large file.
      setTimeout(function(){
        try{
          bulkState.data=validateBulkJson(String(e.target.result||''),bulkState.platform);
          bulkState.progress=100; bulkState.phase=bulkState.data.errors.length?'Validation failed':'Validation complete';
          renderBulkModal();
          if(bulkState.data.errors.length){
            showToast('Validation failed',bulkState.data.errors.length+' error'+(bulkState.data.errors.length===1?'':'s')+' found. Nothing was imported.','error',6000);
          }else{
            showToast('JSON validated',bulkState.data.items.length+' post'+(bulkState.data.items.length===1?'':'s')+' ready to import.','success',3200);
          }
        }catch(err){
          bulkState.data={items:[],errors:['Unexpected validation error: '+(err.message||String(err))],warnings:[]};
          bulkState.progress=100; bulkState.phase='Validation failed';
          renderBulkModal();
          showToast('Import error','The JSON could not be validated. Nothing was imported.','error',6000);
        }
      },30);
    };
    reader.onerror=function(){
      bulkState.data={items:[],errors:['Could not read the selected file. Check that the file is accessible and is a valid JSON file.'],warnings:[]};
      bulkState.progress=100; bulkState.phase='File read failed';
      renderBulkModal();
      showToast('File read failed','The JSON file could not be read. Nothing was imported.','error',6000);
    };
    reader.onabort=function(){
      bulkState.data={items:[],errors:['File reading was cancelled.'],warnings:[]};
      bulkState.progress=0; bulkState.phase='Cancelled';
      renderBulkModal();
      showToast('Import cancelled','No posts were imported.','warning',3000);
    };
    reader.readAsText(file);
  }

  function confirmBulkImport(){
    var result=bulkState.data; if(!result || result.errors.length || !result.items.length) return;
    var added=0, skipped=0;
    var historyPushed=false;
    result.items.forEach(function(item){
      var incomingSourceId=String(item.sourceId||'').trim();
      var incomingPermalink=String(item.permalink||'').trim();
      var exists=state.posts.some(function(p){
        if(incomingSourceId && String(p.sourceId||'').trim()===incomingSourceId) return true;
        if(incomingPermalink && String(p.permalink||'').trim()===incomingPermalink) return true;
        if(p.platform!==item.platform || p.date!==item.date) return false;
        return schemaFor(item.platform).every(function(f){return String(p[f.key]||'').trim()===String(item[f.key]||'').trim();});
      });
      if(exists){skipped++;return;}
      if(!historyPushed){pushHistory();historyPushed=true;}
      Store.add(item); added++;
    });
    closeBulkImport(); render();
    showToast('Import complete', added+' post'+(added===1?'':'s')+' added'+(skipped?' · '+skipped+' duplicate(s) skipped':'')+'.','success',4200);
  }

  // ---------- Events ----------
  function jumpToTablePost(targetId, targetPlatform){
    targetId=String(targetId||'');
    targetPlatform=String(targetPlatform||'');
    if(!targetId || !targetPlatform) return;
    if(!PLATFORMS.some(function(p){return p.key===targetPlatform;})) return;

    // Switch to Tables and the exact platform immediately.
    state.currentTableTab=targetPlatform;
    state.view='tables';
    document.querySelectorAll('.cal-platform-group.open').forEach(function(g){g.classList.remove('open'); var c=g.closest('.cal-cell'); if(c)c.classList.remove('cal-cell-open','cal-cell-preview-open');});
    render();

    // Locate the exact row after the table has been rendered.
    setTimeout(function(){
      var rows=document.querySelectorAll('[data-post-row]');
      var targetRow=null;
      for(var i=0;i<rows.length;i++){
        if(String(rows[i].getAttribute('data-post-row'))===targetId){
          targetRow=rows[i];
          break;
        }
      }
      if(targetRow){
        targetRow.scrollIntoView({behavior:'smooth',block:'center'});
        targetRow.classList.add('row-highlight');
        setTimeout(function(){targetRow.classList.remove('row-highlight');},2200);
      }
    },50);

    var pl=platform(targetPlatform);
    showToast('Opened table', 'Jumped to the selected '+(pl?pl.name:'')+' post.', 'info', 2200);
  }

  function syncUrlState(){
    try{
      var params=new URLSearchParams();
      params.set('view',state.view);
      if(state.view==='calendar') params.set('month',state.currentMonth.year+'-'+String(state.currentMonth.month+1).padStart(2,'0'));
      if(state.view==='tables'){params.set('platform',state.currentTableTab);if(state.tableSearch)params.set('q',state.tableSearch);}
      if(state.view==='metrics') params.set('metricTab',state.metricsTab);
      history.replaceState(null,'','#'+params.toString());
    }catch(e){}
  }
  function loadUrlState(){
    try{
      var raw=location.hash.replace(/^#/,''); if(!raw)return;
      var p=new URLSearchParams(raw), v=p.get('view');
      if(v==='calendar'||v==='tables'||v==='metrics') state.view=v;
      var m=p.get('month'); if(m&&/^\d{4}-\d{2}$/.test(m)){var mp=m.split('-').map(Number);state.currentMonth={year:mp[0],month:mp[1]-1};}
      var plat=p.get('platform'); if(plat==='all'||PLATFORMS.some(function(x){return x.key===plat;}))state.currentTableTab=plat;
      var q=p.get('q'); if(q)state.tableSearch=q;
      var mt=p.get('metricTab'); if(mt)state.metricsTab=mt;
    }catch(e){}
  }

  function downloadFile(name, content, mime){
    var blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'}), url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},500);
  }
  function exportPosts(format){
    var posts=tableFilteredPosts();
    if(!posts.length){showToast('Nothing to export','No posts match the current filters.','info',2200);return;}
    if(format==='json'){
      downloadFile('social-planner-export.json',JSON.stringify(posts,null,2),'application/json');
    }else{
      var rows=[['Platform','Date','Time','Status','Content Type','Content','Views','Likes','Comments']];
      posts.forEach(function(p){rows.push([platform(p.platform).name,p.date,p.time||'',getStatus(p.date),p.contentType||'',getPreview(p),metricNumber(p,'views'),metricNumber(p,'likes'),metricNumber(p,'comments')]);});
      var csv=rows.map(function(r){return r.map(function(v){var x=String(v==null?'':v).replace(/"/g,'""');return '"'+x+'"';}).join(',');}).join('\r\n');
      downloadFile('social-planner-export.csv',csv,'text/csv;charset=utf-8');
    }
    showToast('Export complete',posts.length+' post'+(posts.length===1?'':'s')+' exported.','success',2200);
  }

  function bindGlobalEvents(){
    // Dedicated calendar delegation. This is intentionally separate from the
    // global handler so clicks on preview buttons cannot be swallowed by the
    // calendar day/platform handlers.
    calendarRoot.addEventListener('click', function(e){
      var item=e.target.closest('[data-action="jump-table"]');
      if(!item) return;
      e.preventDefault();
      e.stopPropagation();
      jumpToTablePost(item.getAttribute('data-id'), item.getAttribute('data-platform'));
    });

    function positionCalendarPreview(group){
      if(!group) return;
      var btn=group.querySelector('.cal-platform-btn');
      var preview=group.querySelector('.cal-preview');
      if(!btn || !preview) return;
      var r=btn.getBoundingClientRect();
      var vw=window.innerWidth, vh=window.innerHeight;
      var gap=6, width=Math.min(270, vw-28);
      preview.style.width=width+'px';
      preview.style.maxWidth=width+'px';
      // Temporarily show the preview only for measurement. Do not leave an
      // inline display:block here, otherwise every preview that has ever been
      // hovered remains visible at once.
      var previousDisplay=preview.style.display;
      var previousVisibility=preview.style.visibility;
      preview.style.visibility='hidden';
      preview.style.display='block';
      var h=Math.min(preview.scrollHeight, 360);
      var left=Math.max(14, Math.min(r.left, vw-width-14));
      var top=r.bottom+gap;
      if(top+h > vh-14) top=Math.max(14, r.top-h-gap);
      preview.style.left=Math.round(left)+'px';
      preview.style.top=Math.round(top)+'px';
      preview.style.display=previousDisplay;
      preview.style.visibility=previousVisibility;
    }

    document.body.addEventListener('mouseover', function(e){
      var group=e.target.closest('.cal-platform-group');
      if(!group) return;
      var cell=group.closest('.cal-cell');
      if(cell) cell.classList.add('cal-cell-preview-open');
      positionCalendarPreview(group);
    });
    document.body.addEventListener('mouseout', function(e){
      var group=e.target.closest('.cal-platform-group');
      if(!group) return;
      var related=e.relatedTarget;
      if(related && group.contains(related)) return;
      var cell=group.closest('.cal-cell');
      if(cell && !group.classList.contains('open')) cell.classList.remove('cal-cell-preview-open');
    });
    window.addEventListener('resize', function(){
      document.querySelectorAll('.cal-platform-group:hover, .cal-platform-group.open').forEach(positionCalendarPreview);
    });
    document.addEventListener('scroll', function(){
      document.querySelectorAll('.cal-platform-group:hover, .cal-platform-group.open').forEach(positionCalendarPreview);
    }, true);

    document.body.addEventListener('click', function(e){
      var el;
      if(!e.target.closest('.cal-platform-group')) document.querySelectorAll('.cal-platform-group.open').forEach(function(g){g.classList.remove('open'); var c=g.closest('.cal-cell'); if(c)c.classList.remove('cal-cell-open','cal-cell-preview-open');});

      if((el = e.target.closest('[data-action="calendar-platform"]'))){
        e.preventDefault();
        e.stopPropagation();
        var group=el.closest('.cal-platform-group');
        if(group){
          var wasOpen=group.classList.contains('open');
          document.querySelectorAll('.cal-platform-group.open').forEach(function(g){g.classList.remove('open'); var c=g.closest('.cal-cell'); if(c)c.classList.remove('cal-cell-open','cal-cell-preview-open');});
          if(!wasOpen){ group.classList.add('open'); var cell=group.closest('.cal-cell'); if(cell)cell.classList.add('cal-cell-open'); positionCalendarPreview(group); }
        }
        return;
      }
      if((el = e.target.closest('[data-action="day"]'))){
        if(e.target.closest('.cal-platform-group')) return;
        openDetailPanel(el.dataset.date);
        return;
      }
      if(e.target.closest('[data-action="prev-month"]')){ navMonth(-1); return; }
      if(e.target.closest('[data-action="next-month"]')){ navMonth(1); return; }
      if(e.target.closest('[data-action="today"]')){ goToday(); return; }
      if(e.target.closest('[data-action="add-post"]')){ openPostModal({}); return; }
      if(e.target.closest('[data-action="bulk-import"]')){ openBulkImport(); return; }
      if((el = e.target.closest('[data-action="add-post-for-date"]'))){
        closeDetailPanel();
        openPostModal({ date: el.dataset.date });
        return;
      }
      if((el = e.target.closest('[data-action="jump-table"]'))){
        e.preventDefault();
        e.stopPropagation();
        jumpToTablePost(el.getAttribute('data-id'), el.getAttribute('data-platform'));
        return;
      }
      if((el = e.target.closest('[data-action="view"]'))){
        state.view = el.dataset.view;
        render();
        return;
      }
      if((el = e.target.closest('[data-action="table-tab"]'))){
        state.currentTableTab = el.dataset.platform;
        state.tableContentType = 'all';
        render();
        return;
      }
      if((el = e.target.closest('[data-action="metrics-tab"]'))){
        state.metricsTab = el.dataset.platform;
        state.view = 'metrics';
        render();
        return;
      }
      if((el = e.target.closest('tr[data-post-row]'))){
        if(e.target.closest('[data-row-control="true"]') || e.target.closest('button') || e.target.closest('input')) return;
        var tablePost = state.posts.find(function(p){ return p.id===el.dataset.postRow; });
        if(tablePost){ openTablePostDetail(tablePost); }
        return;
      }
      if((el = e.target.closest('[data-action="sort-direction"]'))){state.tableSortDir=state.tableSortDir==='desc'?'asc':'desc';render();return;}
      if((el = e.target.closest('[data-action="clear-table-filters"]'))){state.tableSearch='';state.tableContentType='all';state.tableStatus='all';state.tableSort='date';state.tableSortDir='asc';render();return;}
      if((el = e.target.closest('[data-action="export-json"]'))){exportPosts('json');return;}
      if((el = e.target.closest('[data-action="export-csv"]'))){exportPosts('csv');return;}
      if((el = e.target.closest('[data-action="print-table"]'))){window.print();return;}
      if((el = e.target.closest('[data-action="edit-post"]'))){
        var post = state.posts.find(function(p){ return p.id===el.dataset.id; });
        if(post){
          closeDetailPanel();
          openPostModal(post);
        }
        return;
      }
      if((el=e.target.closest('[data-action="enter-delete-mode"]'))){ state.selectionMode=true; clearSelection(); render(); return; }
      if((el=e.target.closest('[data-action="exit-delete-mode"]'))){ state.selectionMode=false; clearSelection(); render(); return; }
      if((el=e.target.closest('[data-action="delete-selected"]'))){ deleteSelectedPosts(); return; }
      if((el=e.target.closest('[data-action="delete-post"]'))){
        deletePostById(el.getAttribute('data-id'));
        return;
      }
      if(e.target.closest('[data-action="close-detail"]')){ closeDetailPanel(); return; }
      if(e.target.id === 'detailOverlay'){ closeDetailPanel(); return; }

      if((el = e.target.closest('[data-action="pick-platform"]'))){ pickPlatform(el.dataset.platform); return; }
      if((el = e.target.closest('[data-action="bulk-platform"]'))){
        bulkState.platform=el.dataset.platform; bulkState.fileName=''; bulkState.data=null; renderBulkModal(); return;
      }
      if(e.target.closest('[data-action="close-bulk"]')){ closeBulkImport(); return; }
      if(e.target.closest('[data-action="confirm-bulk"]')){ confirmBulkImport(); return; }
      if(e.target.closest('[data-action="close-post-modal"]')){ closePostModal(); return; }
      if(e.target.closest('[data-action="save-post-modal"]')){ saveModal(); return; }
      if(e.target.closest('[data-action="delete-modal"]')){
        if(modalState.id) deletePostById(modalState.id);
        return;
      }
      if(e.target.id === 'postOverlay'){ closePostModal(); return; }
    });

    document.body.addEventListener('input', function(e){
      if(e.target.id === 'tableSearch'){
        state.tableSearch=e.target.value;
        render();
        setTimeout(function(){var q=document.getElementById('tableSearch');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}},0);
      }
    });

    document.body.addEventListener('change', function(e){
      if(e.target.matches('[data-action="select-post"]')){
        var id=e.target.dataset.id;
        if(e.target.checked) state.selectedPosts[id]=true; else delete state.selectedPosts[id];
        render(); return;
      }
      if(e.target.matches('[data-action="select-all-visible"]')){
        var boxes=document.querySelectorAll('[data-action="select-post"]');
        for(var i=0;i<boxes.length;i++){var id2=boxes[i].dataset.id;if(e.target.checked)state.selectedPosts[id2]=true;else delete state.selectedPosts[id2];}
        render(); return;
      }
      if(e.target.id === 'bulkFileInput'){
        var file=e.target.files && e.target.files[0];
        if(file) readBulkFile(file);
        return;
      }
      if(e.target.id === 'tableSearch'){ state.tableSearch=e.target.value; render(); setTimeout(function(){var q=document.getElementById('tableSearch');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}},0); return; }
      if(e.target.id === 'tableContentType'){ state.tableContentType=e.target.value; render(); return; }
      if(e.target.id === 'tableStatus'){ state.tableStatus=e.target.value; render(); return; }
      if(e.target.id === 'tableSort'){ state.tableSort=e.target.value; render(); return; }
      if(e.target.id === 'analysisMetric'){ state.analysisMetric=e.target.value; render(); return; }
      if(e.target.id === 'analysisDimension'){ state.analysisDimension=e.target.value; render(); return; }
    });

    calendarRoot.addEventListener('dragstart', function(e){
      var item=e.target.closest('[data-drag-post]'); if(!item)return;
      state.dragPostId=item.getAttribute('data-drag-post'); item.classList.add('dragging');
      if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',state.dragPostId);}
    });
    calendarRoot.addEventListener('dragend', function(e){var item=e.target.closest('[data-drag-post]');if(item)item.classList.remove('dragging');calendarRoot.querySelectorAll('.drag-over').forEach(function(c){c.classList.remove('drag-over');});state.dragPostId=null;});
    calendarRoot.addEventListener('dragover', function(e){var cell=e.target.closest('.cal-cell');if(!cell)return;e.preventDefault();cell.classList.add('drag-over');if(e.dataTransfer)e.dataTransfer.dropEffect='move';});
    calendarRoot.addEventListener('dragleave', function(e){var cell=e.target.closest('.cal-cell');if(cell && !cell.contains(e.relatedTarget))cell.classList.remove('drag-over');});
    calendarRoot.addEventListener('drop', function(e){
      var cell=e.target.closest('.cal-cell'); if(!cell)return; e.preventDefault();cell.classList.remove('drag-over');
      var id=(e.dataTransfer&&e.dataTransfer.getData('text/plain'))||state.dragPostId; if(!id)return;
      var post=state.posts.find(function(p){return String(p.id)===String(id);}); if(!post||cell.classList.contains('cal-cell-dim'))return;
      var newDate=cell.getAttribute('data-date'); if(!newDate||post.date===newDate)return;
      pushHistory(); Store.update(post.id,{date:newDate}); state.currentMonth={year:Number(newDate.slice(0,4)),month:Number(newDate.slice(5,7))-1}; render(); showToast('Post rescheduled','Moved to '+prettyDateShort(newDate)+'.','success',2400);
    });

    document.addEventListener('keydown', function(e){
      if(e.key==='Escape'){
        if(!postOverlay.classList.contains('hidden')) closePostModal();
        else if(!bulkOverlay.classList.contains('hidden')) closeBulkImport();
        else if(!detailOverlay.classList.contains('hidden')) closeDetailPanel();
        return;
      }
      var tag=(e.target.tagName||'').toLowerCase();
      if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable) return;
      if(state.view==='calendar' && !document.querySelector('.overlay:not(.hidden)')){
        if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='Enter') e.preventDefault();
        if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){
          var base=state.focusDate?new Date(state.focusDate+'T12:00:00'):new Date();var delta=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:e.key==='ArrowUp'?-7:7;base.setDate(base.getDate()+delta);state.focusDate=formatDate(base);var target=new Date(base.getFullYear(),base.getMonth(),1);state.currentMonth={year:target.getFullYear(),month:target.getMonth()};render();setTimeout(function(){var cell=document.querySelector('.cal-cell[data-date="'+state.focusDate+'"]');if(cell)cell.focus();},0);return;
        }
        if(e.key==='Enter'){var cell=document.querySelector('.cal-cell[data-date="'+state.focusDate+'"]');if(cell)openDetailPanel(state.focusDate);return;}
      }
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redoChange();else undoChange();}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redoChange();}
    });
  }

  // ---------- Init ----------
  document.addEventListener('DOMContentLoaded', function(){
    cacheDom();
    bindGlobalEvents();
    Store.load();
    loadUrlState();
    render();
    setTimeout(function(){
      if(appBoot) appBoot.classList.add('hide');
      showToast('Planner ready', state.posts.length+' saved post'+(state.posts.length===1?'':'s')+' loaded from this browser.','success',2800);
    },260);
  });

  window.addEventListener('error', function(e){
    if(e && e.error){ console.error(e.error); }
    showToast('Something went wrong','An unexpected error occurred. Check the browser console for details.','error',6000);
  });
})();
</script>
</body>
