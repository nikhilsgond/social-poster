<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}

  /* Minimal dark scrollbars everywhere — keep scrolling without the browser-default look. */
  *{
    scrollbar-width:thin;
    scrollbar-color:#3a3a3a transparent;
  }
  *::-webkit-scrollbar{width:6px;height:6px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{
    background:#3a3a3a;
    border-radius:999px;
    border:1px solid transparent;
    background-clip:padding-box;
  }
  *::-webkit-scrollbar-thumb:hover{background:#505050;}
  *::-webkit-scrollbar-corner{background:transparent;}

  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top,0px); }
  button,input,select,textarea{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

  :root{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --panel-alt:#F4F4F4;
    --border:#E2E2E2;
    --ink:#111111;
    --muted:#6E6E6E;
    --shadow:0 1px 2px rgba(0,0,0,0.06);
  }


  *:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  .topbar{
    position:relative; z-index:1000;
    display:flex; align-items:center; gap:14px; padding:14px 26px; border-bottom:1px solid var(--border);
    background:var(--panel); flex-wrap:wrap; box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .brand{ font-weight:800; font-size:1.2rem; letter-spacing:-0.025em; margin-right:4px; }
  .brand-sub{font-size:.72rem;color:var(--muted);font-weight:500;padding-left:4px;border-left:1px solid var(--border);}
  .toolbar-actions{display:flex;gap:7px;margin-left:auto;align-items:center;}
  .btn-import{ background:var(--panel); border:1px solid var(--border); color:var(--ink); padding:9px 14px; border-radius:7px; font:inherit; font-weight:600; cursor:pointer; font-size:.82rem;}
  .btn-import:hover{background:var(--panel-alt);border-color:#B8B8B8;}
  .btn-primary{box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .bulk-summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
  .bulk-stat{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--panel-alt);font-size:.75rem;color:var(--muted);}
  .bulk-stat strong{color:var(--ink);}
  .bulk-errors{border:1px solid #D9D9D9;background:var(--panel-alt);border-radius:8px;padding:10px 12px;max-height:190px;overflow:auto;font-size:.78rem;}
  .bulk-errors .error{padding:5px 0;border-bottom:1px solid var(--border);}
  .bulk-errors .error:last-child{border-bottom:none;}
  .bulk-ok{border:1px solid var(--border);background:var(--panel-alt);border-radius:8px;padding:10px 12px;font-size:.78rem;}
  .json-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.7rem;line-height:1.55;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:10px;white-space:pre-wrap;overflow:auto;}
  .file-drop{border:1px dashed var(--border);border-radius:9px;padding:18px;text-align:center;background:var(--panel-alt);cursor:pointer;}
  .file-drop:hover{border-color:var(--ink);}
  .file-drop input{display:none;}
  .file-drop strong{display:block;font-size:.85rem;margin-bottom:4px;}
  .file-drop span{font-size:.74rem;color:var(--muted);}
  .month-nav{ display:flex; align-items:center; gap:8px; }
  .month-nav button{ border:1px solid var(--border); background:var(--panel); color:var(--ink); padding:7px 14px; border-radius:6px; font:inherit; font-weight:500; cursor:pointer; font-size:0.83rem; }
  .month-nav button:hover{ background:var(--panel-alt); }
  .month-label{ font-weight:700; font-size:1rem; min-width:150px; text-align:center; }
  .view-nav{ display:flex; gap:6px; margin-left:auto; }
  .view-nav button{ border:1px solid var(--border); background:var(--panel); color:var(--muted); padding:8px 16px; border-radius:6px; font:inherit; font-weight:500; cursor:pointer; font-size:0.83rem; }
  .view-nav button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .btn-primary{ background:var(--ink); color:var(--bg); border:1px solid var(--ink); padding:9px 18px; border-radius:6px; font:inherit; font-weight:600; cursor:pointer; font-size:0.83rem; }
  .btn-primary:hover{ opacity:0.85; }
  .btn-secondary{ background:var(--panel); border:1px solid var(--border); color:var(--ink); padding:9px 16px; border-radius:6px; font:inherit; cursor:pointer; font-size:0.83rem; }
  .btn-secondary:hover{ background:var(--panel-alt); }
  .btn-danger{ background:var(--panel); border:1px solid var(--ink); color:var(--ink); padding:9px 16px; border-radius:6px; font:inherit; cursor:pointer; font-size:0.83rem; }
  .btn-danger:hover{ background:var(--ink); color:var(--bg); }

  main#mainArea{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; scrollbar-gutter:stable; padding:18px 26px 24px; display:flex; }
  .view-panel{ flex:1; min-height:0; display:flex; flex-direction:column; max-width:1280px; width:100%; margin:0 auto; }
  .hidden{ display:none !important; }

  .hint-bar{ background:var(--panel-alt); border:1px dashed var(--border); border-radius:7px; padding:8px 12px; font-size:0.78rem; color:var(--muted); margin-bottom:10px; max-width:1180px; width:100%; margin-left:auto; margin-right:auto; }

  /* Calendar */
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); max-width:1180px; width:100%; margin:0 auto; }
  .cal-weekday{ text-align:center; font-size:0.74rem; color:var(--muted); padding:6px 0; font-weight:600; }
  .cal-grid{ position:relative; z-index:2; flex:none; height:clamp(480px,calc(100dvh - 190px),820px); min-height:480px; max-height:820px; display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:visible; max-width:1180px; width:100%; margin:0 auto; }
  .cal-cell{ background:var(--panel); padding:10px; display:flex; flex-direction:column; min-height:0; overflow:visible; position:relative; cursor:pointer; z-index:1; }
.cal-cell.cal-cell-open{ z-index:20; }
  /* Keep the cell that owns an open/hovered preview above every neighboring calendar cell. */
  .cal-cell.cal-cell-preview-open{ z-index:1000 !important; }
  .cal-cell:hover{ background:var(--panel-alt); }
  .cal-cell-dim{ background:var(--panel-alt); opacity:0.5; }
  .cal-cell-today{ box-shadow: inset 0 0 0 2px var(--ink); }
  .cal-cell-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; flex-shrink:0; }
  .cal-cell-num{ font-size:0.76rem; font-weight:700; color:var(--ink); }
  .cal-chip-list{ display:flex; flex-direction:column; gap:4px; overflow:visible; flex:1; min-height:0; }
  .cal-platform-group{ position:relative; }
  .cal-platform-btn{ width:100%; border:1px solid var(--border); border-radius:7px; background:var(--panel); color:var(--ink); font-size:.67rem; font-weight:650; padding:5px 7px; text-align:left; cursor:pointer; font-family:inherit; display:flex; gap:6px; align-items:center; transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease; }
  .cal-platform-btn:hover,.cal-platform-group.open .cal-platform-btn{ transform:translateY(-1px); border-color:var(--ink); box-shadow:0 6px 16px rgba(0,0,0,.09); }
  .platform-icon{ width:18px; height:18px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 18px; }
  .platform-icon svg{ width:12px; height:12px; display:block; color:#FFFFFF; }
  .platform-count{ margin-left:auto; font-variant-numeric:tabular-nums; font-weight:800; }
  .cal-preview{ position:fixed !important; left:0; top:0; width:270px; max-height:360px; overflow:auto; max-width:min(270px,calc(100vw - 28px)); background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 35px rgba(0,0,0,.16); padding:7px; z-index:2147483647 !important; display:none; animation:previewIn .15s ease both; }
  /* Preview uses the same minimal dark scrollbar. */
  .cal-preview{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent;}
  .cal-preview::-webkit-scrollbar{width:6px;height:6px;}
  .cal-preview::-webkit-scrollbar-track{background:transparent;}
  .cal-preview::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:999px;border:1px solid transparent;background-clip:padding-box;}
  .cal-preview::-webkit-scrollbar-thumb:hover{background:#505050;}
  .cal-platform-group.open .cal-preview, .cal-platform-group:hover .cal-preview{ display:block; }
  .cal-preview-title{ font-size:.68rem; color:var(--muted); padding:3px 5px 6px; font-weight:700; }
  .cal-preview-item{ width:100%; border:0; background:transparent; color:var(--ink); border-radius:7px; padding:7px; text-align:left; cursor:pointer; display:block; font-family:inherit; }
  .cal-preview-item:hover{ background:var(--panel-alt); }
  .cal-preview-meta{ display:flex; gap:6px; align-items:center; font-size:.62rem; color:var(--muted); margin-bottom:2px; }
  .cal-preview-post-title{ font-size:.72rem; font-weight:650; line-height:1.25; }
  .cal-preview-type{ font-size:.56rem; border:1px solid var(--border); border-radius:4px; padding:1px 4px; }
  @keyframes previewIn{from{opacity:0;transform:translateY(-3px) scale(.985)}to{opacity:1;transform:none}}

  /* Tables — wide, readable, no inner scrollbar */
  .table-tabs{display:flex;gap:8px;margin-bottom:0;flex-wrap:wrap;}
  .table-tab{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:.8rem;font-weight:600;font-family:inherit;white-space:nowrap;transition:all .16s ease;}
  .table-tab:hover{background:var(--panel-alt);color:var(--ink);transform:translateY(-1px);}
  .table-tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .table-wrap{width:100%;overflow:visible;border:1px solid var(--border);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);}
  table.data-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:.79rem;}
  table.data-table th{background:var(--panel-alt);text-align:left;padding:11px 10px;font-weight:700;color:var(--muted);font-size:.68rem;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.data-table td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:top;white-space:normal;overflow-wrap:normal;word-break:normal;line-height:1.42;}
  table.data-table td:nth-child(1),table.data-table td:nth-child(2){white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.data-table td:nth-child(3),table.data-table td:nth-child(4){white-space:nowrap;}
  table.data-table td:nth-child(5){font-weight:650;overflow-wrap:break-word;}
  table.data-table td:nth-child(6){color:var(--muted);overflow-wrap:break-word;}
  table.data-table td:nth-child(7),table.data-table td:nth-child(8),table.data-table td:nth-child(9){white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;}
  table.data-table td:nth-child(10){white-space:nowrap;text-align:center;color:var(--muted);}
  table.data-table td:nth-child(11){white-space:nowrap;text-align:center;}
  table.data-table td .btn-secondary{padding:6px 10px;font-size:.7rem;border-radius:7px;white-space:nowrap;}
  .data-table tbody tr{transition:background .16s ease,box-shadow .16s ease;cursor:default;}
  .data-table tbody tr:hover{background:var(--panel-alt);}
  .data-table tbody tr.row-highlight{animation:rowFlash 1.8s ease;box-shadow:inset 3px 0 0 var(--ink);}
  .status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--border);border-radius:999px;font-size:.68rem;font-weight:700;line-height:1;white-space:nowrap;}
  .status-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .status-posted{color:#15803d;background:rgba(22,163,74,.08);border-color:rgba(22,163,74,.22);}
  .status-scheduled{color:#b45309;background:rgba(217,119,6,.08);border-color:rgba(217,119,6,.22);}
  @keyframes rowFlash{0%,100%{background:transparent}20%,60%{background:var(--panel-alt)}}
  @media(max-width:1000px){
    table.data-table{font-size:.74rem;}
    table.data-table th,table.data-table td{padding:9px 7px;}
  }


  /* Planner additions */
  .table-filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--panel);}
  .table-filters input,.table-filters select{border:1px solid var(--border);background:var(--panel);color:var(--ink);border-radius:7px;padding:8px 10px;font:inherit;font-size:.75rem;min-height:34px;}
  .table-filters input{min-width:230px;flex:1;}
  .table-filter-count{font-size:.72rem;color:var(--muted);margin-left:auto;white-space:nowrap;}
  .filter-clear{padding:7px 10px!important;}
  .toolbar-mini{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .btn-mini{padding:7px 10px!important;font-size:.72rem!important;}
  .cal-preview-item[draggable="true"]{cursor:grab;}
  .cal-preview-item.dragging{opacity:.45;}
  .cal-cell.drag-over{box-shadow:inset 0 0 0 2px var(--ink);background:var(--panel-alt);}
  .undo-disabled{opacity:.42;pointer-events:none;}
  @media(max-width:760px){.table-filters input{min-width:150px}.table-filter-count{margin-left:0}.toolbar-actions{margin-left:0}.topbar{padding:11px 14px}.view-nav{margin-left:0}.cal-grid{min-height:440px;height:calc(100dvh - 205px);}}
  @media print{
    @page{margin:12mm;}
    body{background:#fff!important;color:#111!important;}
    .topbar,.hint-bar,.table-filters,.selection-toolbar,.table-tabs,.btn-secondary,.btn-primary,.btn-danger,.toolbar-actions,.view-nav{display:none!important;}
    main#mainArea{overflow:visible!important;padding:0!important;display:block!important;}
    .view-panel.hidden{display:none!important;}
    .view-panel{max-width:none!important;}
    .table-wrap{overflow:visible!important;border:0!important;}
    table.data-table{font-size:9pt!important;}
    table.data-table th,table.data-table td{padding:5px!important;}
    .cal-grid{height:auto!important;max-height:none!important;min-height:0!important;overflow:visible!important;}
    .cal-preview{display:none!important;}
  }

  /* Metrics dashboard */
  #metricsRoot{overflow:visible;padding-bottom:24px;}
  .metrics-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;}
  .metrics-head-copy h2{margin:0;font-size:1.35rem;letter-spacing:-.02em;}
  .metrics-head-copy p{margin:3px 0 0;color:var(--muted);font-size:.76rem;}
  .metrics-tabs{display:flex;gap:7px;padding:3px 2px 9px;margin-bottom:14px;}
  .metrics-tab{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:9px;padding:8px 11px;font:inherit;font-size:.76rem;font-weight:650;cursor:pointer;transition:all .16s ease;}
  .metrics-tab:hover{background:var(--panel-alt);color:var(--ink);transform:translateY(-1px);}
  .metrics-tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .metrics-tab.active .platform-icon{box-shadow:0 0 0 2px rgba(255,255,255,.16);}
  .metrics-context{display:flex;align-items:center;gap:9px;margin:2px 0 15px;color:var(--muted);font-size:.76rem;}
  .metrics-context strong{color:var(--ink);font-size:.9rem;}
  .kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px;}
  .kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:13px 14px;min-width:0;box-shadow:var(--shadow);}
  .kpi-label{font-size:.66rem;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.055em;}
  .kpi-value{font-size:1.28rem;font-weight:800;letter-spacing:-.025em;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-sub{font-size:.64rem;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .metrics-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px;}
  .metrics-grid.equal{grid-template-columns:1fr 1fr;}
  .chart-card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:15px;min-width:0;box-shadow:var(--shadow);}
  .chart-card h3{margin:0;font-size:.9rem;font-weight:750;letter-spacing:-.01em;}
  .chart-subtitle{margin:3px 0 12px;color:var(--muted);font-size:.68rem;}
  .metric-chart-bars{display:flex;flex-direction:column;gap:9px;}
  .metric-bar-row{display:grid;grid-template-columns:118px 1fr 60px;align-items:center;gap:9px;min-width:0;}
  .metric-bar-label{display:flex;align-items:center;gap:6px;min-width:0;font-size:.69rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .metric-bar-track{height:9px;background:var(--panel-alt);border-radius:999px;overflow:hidden;}
  .metric-bar-fill{height:100%;border-radius:999px;min-width:2px;transition:width .45s ease;}
  .metric-bar-value{text-align:right;font-size:.67rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .donut-layout{display:flex;align-items:center;gap:18px;min-height:188px;}
  .donut{width:150px;height:150px;border-radius:50%;position:relative;flex:0 0 150px;background:var(--panel-alt);}
  .donut::after{content:"";position:absolute;inset:31px;border-radius:50%;background:var(--panel);border:1px solid var(--border);}
  .donut-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;flex-direction:column;}
  .donut-center strong{font-size:1.05rem;}
  .donut-center span{font-size:.62rem;color:var(--muted);}
  .donut-legend{display:flex;flex-direction:column;gap:7px;min-width:0;}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:.68rem;min-width:0;}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .legend-item span:last-child{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;}
  .trend-wrap{width:100%;overflow:hidden;}
  .trend-svg{display:block;width:100%;height:220px;}
  .trend-grid{stroke:var(--border);stroke-width:1;}
  .trend-line{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
  .trend-dot{fill:var(--ink);}
  .trend-label{fill:var(--muted);font-size:9px;font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;}
  .weekday-grid{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:8px;height:190px;padding-top:10px;}
  .weekday-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0;}
  .weekday-value{font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums;}
  .weekday-track{width:100%;height:130px;background:var(--panel-alt);border-radius:7px;display:flex;align-items:flex-end;overflow:hidden;}
  .weekday-fill{width:100%;background:var(--ink);border-radius:7px;min-height:2px;transition:height .45s ease;}
  .weekday-name{font-size:.62rem;color:var(--muted);}
  .top-posts{display:flex;flex-direction:column;gap:0;}
  .top-post{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);min-width:0;}
  .top-post:last-child{border-bottom:0;}
  .top-post-rank{font-size:.72rem;font-weight:800;color:var(--muted);text-align:center;}
  .top-post-main{min-width:0;}
  .top-post-title{font-size:.72rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-post-meta{font-size:.62rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;}
  .top-post-metric{text-align:right;font-size:.7rem;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .empty-metrics{padding:34px 10px;text-align:center;color:var(--muted);font-size:.76rem;border:1px dashed var(--border);border-radius:9px;}
  @media(max-width:1050px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.metrics-grid,.metrics-grid.equal{grid-template-columns:1fr}.metric-bar-row{grid-template-columns:105px 1fr 58px;}}
  @media(max-width:680px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.donut-layout{flex-direction:column;align-items:flex-start}.metrics-head{align-items:flex-start;flex-direction:column}.metric-bar-row{grid-template-columns:92px 1fr 52px}.metrics-tab{padding:7px 9px}}

  /* Metrics */
  .metrics-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .metrics-toolbar select{ border:1px solid var(--border); background:var(--panel); color:var(--ink); padding:8px 12px; border-radius:6px; font:inherit; font-size:0.83rem; }

/* ---------- Interaction / feedback layer ---------- */
.app-boot{position:fixed;top:14px;right:14px;z-index:9999;display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 8px 30px rgba(0,0,0,.10);font-size:12px;font-weight:700;opacity:1;transition:opacity .35s ease,transform .35s ease;backdrop-filter:blur(10px)}
.app-boot.hide{opacity:0;transform:translateY(-8px);pointer-events:none}
.boot-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.45);animation:bootPulse 1.5s infinite}
.toast-stack{position:fixed;right:18px;bottom:18px;z-index:10000;display:flex;flex-direction:column;gap:9px;width:min(360px,calc(100vw - 36px));pointer-events:none}
.toast{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start;padding:12px 13px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.98);box-shadow:0 14px 38px rgba(0,0,0,.14);animation:toastIn .28s cubic-bezier(.2,.8,.2,1) both;pointer-events:auto}
.toast.out{animation:toastOut .24s ease both}
.toast .toast-bar{width:4px;height:100%;min-height:30px;border-radius:99px;background:#111}
.toast.success .toast-bar{background:#16a34a}.toast.error .toast-bar{background:#dc2626}.toast.info .toast-bar{background:#2563eb}.toast.warning .toast-bar{background:#d97706}
.toast-title{font-size:12px;font-weight:800;line-height:1.25;margin-bottom:2px}.toast-msg{font-size:12px;color:var(--muted);line-height:1.35}.toast-close{border:0;background:transparent;color:#888;cursor:pointer;padding:0 2px;font-size:16px;line-height:1}
.storage-status{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:5px 9px;border:1px solid var(--border);border-radius:999px;background:var(--panel);font-size:11px;font-weight:800;color:var(--muted);vertical-align:middle;transition:all .25s ease}
.storage-status.saving{color:#b45309;border-color:#f59e0b;background:#fffbeb}.storage-status.saved{color:#15803d;border-color:#86efac;background:#f0fdf4}.storage-status.error{color:#b91c1c;border-color:#fca5a5;background:#fef2f2}
.storage-dot{width:6px;height:6px;border-radius:50%;background:currentColor}.storage-status.saving .storage-dot{animation:bootPulse .9s infinite}
button,.platform-pick-btn,.chip,.card,.day,.metric-card{transition:transform .16s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease,opacity .2s ease}
button:not(:disabled):hover{transform:translateY(-1px)}
button:not(:disabled):active{transform:translateY(0) scale(.98)}
.day:hover{box-shadow:0 7px 22px rgba(0,0,0,.08);transform:translateY(-1px)}
.card:hover,.metric-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.08)}
.panel{animation:panelIn .2s cubic-bezier(.2,.8,.2,1)}
.modal-backdrop,.overlay{animation:fadeIn .18s ease both}
.post-chip{animation:chipIn .22s ease both}
@keyframes bootPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.35)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes chipIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

  function schemaFor(key){ return FIELD_SCHEMA[key] || FIELD_SCHEMA.x; }

  function escapeHtml(str){
    if(str===undefined || str===null) return '';
    return String(str).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function truncate(str, n){
    if(!str) return '';
    return str.length>n ? str.slice(0,n-1)+'\u2026' : str;
  }
  function formatDate(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function prettyDate(dateStr){
    if(!dateStr) return '';
    var parts=dateStr.split('-');
    var d=new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
  }
  function prettyDateShort(dateStr){
    if(!dateStr) return '';
    var parts=dateStr.split('-');
    var d=new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
  }
  function relativeTime(ts){
    if(!ts) return '\u2014';
    var diff=Date.now()-ts;
    var min=60000, hr=3600000, day=86400000;
    if(diff<min) return 'just now';
    if(diff<hr) return Math.floor(diff/min)+'m ago';
    if(diff<day) return Math.floor(diff/hr)+'h ago';
    if(diff<day*30) return Math.floor(diff/day)+'d ago';
    return new Date(ts).toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
  }
  function getStatus(dateStr){
    var today = formatDate(new Date());
    return dateStr < today ? 'posted' : 'scheduled';
  }
  function getPreview(post){
    var text;
    switch(post.platform){
      case 'yt': text = post.title || ''; break;
      case 'ig': text = post.caption || post.topic || ''; break;
      case 'fb': text = post.content || post.topic || ''; break;
      default: text = post.content || post.topic || '';
    }
    return text || '(no content yet)';
  }

  // ---------- Notifications / save feedback ----------
  var toastStack = document.getElementById('toastStack');
  var storageStatus = document.getElementById('storageStatus');
  var appBoot = document.getElementById('appBoot');
  var toastSeq = 0;

  function showToast(title, message, type, duration){
    type = type || 'info'; duration = duration || 3200;
    if(!toastStack) return;
    var id='toast_'+(++toastSeq);
    var el=document.createElement('div');
    el.className='toast '+type; el.id=id;
    el.innerHTML='<div class="toast-bar"></div><div><div class="toast-title">'+escapeHtml(title)+'</div><div class="toast-msg">'+escapeHtml(message||'')+'</div></div><button class="toast-close" type="button" aria-label="Dismiss">×</button>';
    el.querySelector('.toast-close').addEventListener('click',function(){dismissToast(el);});
    toastStack.appendChild(el);
    while(toastStack.children.length>4){ dismissToast(toastStack.firstElementChild); }
    setTimeout(function(){dismissToast(el);},duration);
  }
  function dismissToast(el){
    if(!el || !el.parentNode || el.classList.contains('out')) return;
    el.classList.add('out'); setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},230);
  }
  function setStorageStatus(kind, label){
    if(!storageStatus) return;
    storageStatus.className='storage-status '+kind;
    var t=storageStatus.querySelector('.storage-label'); if(t)t.textContent=label;
  }
  function flashSaved(){
    setStorageStatus('saving','Saving…');
    setTimeout(function(){setStorageStatus('saved','Saved locally');},180);
  }

  // ---------- State ----------
  var state = {
    posts: [],
    view: 'calendar',
    currentMonth: (function(){ var t=new Date(); return { year:t.getFullYear(), month:t.getMonth() }; })(),
    currentTableTab: 'yt',
    metricsTab: 'all',
    analysisMetric: 'views',
    analysisDimension: 'contentType',

    tableStatus: 'all',
    tableSort: 'date',
    tableSortDir: 'asc',
    history: [],
    redoHistory: [],
    focusDate: formatDate(new Date()),
  };

  var modalState = { id:null, platform:'yt', date:'', time:'', fields:{}, metrics:{ views:'', likes:'', comments:'' } };

  // ---------- Persistent Store ----------
  // Schedules are stored in browser storage and restored automatically on startup.
  // Data survives browser/app restarts and remains until the user deletes it or
  // clears this browser's site data.
  var STORE_KEY = 'social_planner_posts_v2';
  var LEGACY_STORE_KEY = 'sp_posts';

  var Store = {
    load(){
      try{
        var raw = localStorage.getItem(STORE_KEY);
        if(raw){
          var parsed = JSON.parse(raw);
          state.posts = (Array.isArray(parsed) ? parsed : (parsed.posts || [])).map(function(p, idx){
            // Backward compatibility with the previous Facebook `type` field.
            if(!p.contentType && p.type){ p.contentType = p.type; }
            if(!p.id) p.id='p_legacy_'+idx+'_'+Date.now();
            return p;
          });
          this.save();
          setStorageStatus('saved','Saved locally');
          return;
        }

        // Migrate schedules from the original planner version.
        var legacy = localStorage.getItem(LEGACY_STORE_KEY);
        if(legacy){
          var legacyPosts = JSON.parse(legacy);
          state.posts = (Array.isArray(legacyPosts) ? legacyPosts : []).map(function(p, idx){
            if(!p.contentType && p.type){ p.contentType = p.type; }
            if(!p.id) p.id='p_legacy_'+idx+'_'+Date.now();
            return p;
          });
          this.save();
        } else {
          state.posts = [];
        }
      }catch(e){
        console.error('Could not load saved schedules:', e);
        state.posts = [];
        setStorageStatus('error','Storage unavailable');
      }
    },

    save(){
      try{
        localStorage.setItem(STORE_KEY, JSON.stringify(state.posts));
        setStorageStatus('saved','Saved locally');
        return true;
      }catch(e){
        console.error('Could not save schedules:', e);
        try{
          localStorage.removeItem(LEGACY_STORE_KEY);
          localStorage.setItem(STORE_KEY, JSON.stringify(state.posts));
          setStorageStatus('saved','Saved locally');
          return true;
        }catch(retryError){
          setStorageStatus('error','Storage full');
          setTimeout(function(){showToast('Storage limit reached','Your browser storage is full. Export or remove older posts before adding more data.','error',5200);},0);
          return false;
        }
      }
    },

    add(data){
      var id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      var payload = Object.assign({id:id, createdAt:Date.now(), updatedAt:Date.now()}, data);
      state.posts.push(payload);
      var ok=this.save();
      if(ok) flashSaved();
      return id;
    },

    update(id, data){
      var idx=-1;
      for(var i=0;i<state.posts.length;i++){
        if(state.posts[i].id===id){ idx=i; break; }
      }
      if(idx>-1){
        state.posts[idx] = Object.assign({}, state.posts[idx], data, {updatedAt:Date.now()});
        var ok=this.save();
        if(ok) flashSaved();
      }
    },

    remove(id){
      var target=String(id||'');
      var before=state.posts.length;
      state.posts = state.posts.filter(function(p){ return String(p.id||'')!==target; });
      var removed = state.posts.length < before;
      if(removed) this.save();
      return removed;
    },

    clearAll(){
      state.posts = [];
      this.save();
    }
  };

  // ---------- History / undo-redo ----------
  function clonePosts(posts){ return JSON.parse(JSON.stringify(posts || state.posts)); }
  function pushHistory(){ state.history.push(clonePosts()); if(state.history.length>50) state.history.shift(); state.redoHistory=[]; }
  function restoreHistory(posts){ state.posts=clonePosts(posts); state.selectedPosts={}; Store.save(); render(); }
  function undoChange(){ if(!state.history.length){showToast('Nothing to undo','There are no previous changes.','info',1800);return;} state.redoHistory.push(clonePosts()); var snap=state.history.pop(); restoreHistory(snap); showToast('Undo','Previous change restored.','success',1800); }
  function redoChange(){ if(!state.redoHistory.length){showToast('Nothing to redo','There are no changes waiting to be restored.','info',1800);return;} state.history.push(clonePosts()); var snap=state.redoHistory.pop(); restoreHistory(snap); showToast('Redo','Change restored.','success',1800); }

  // ---------- Bulk selection / deletion ----------
  function selectedIds(){ return Object.keys(state.selectedPosts).filter(function(id){ return state.selectedPosts[id] && state.posts.some(function(p){return p.id===id;}); }); }
  function clearSelection(){ state.selectedPosts={}; }
  function deleteSelectedPosts(){
    var ids=selectedIds(); if(!ids.length) return;
    if(!confirm('Delete '+ids.length+' selected post'+(ids.length===1?'':'s')+'?')) return;
    pushHistory();
    var idSet={}; ids.forEach(function(id){idSet[String(id)]=true;});
    state.posts=state.posts.filter(function(p){return !idSet[String(p.id||'')];});
    clearSelection();
    var saved=Store.save();
    render();
    if(saved) showToast('Posts deleted',ids.length+' post'+(ids.length===1?'':'s')+' removed.','success',2600);
  }

  function deletePostById(id){
    var target=String(id||'');
    if(!target) return;
    var post=state.posts.find(function(p){return String(p.id||'')===target;});
    if(!post) return;
    if(!confirm('Delete this post?')) return;
    pushHistory();
    var removed=Store.remove(target);
    if(!removed) return;
    delete state.selectedPosts[target];
    closeDetailPanel();
    closePostModal();
    render();
    showToast('Post deleted','The post was removed from your calendar.','success',2600);
  }

    calendarRoot = document.getElementById('calendarRoot');
    tablesRoot = document.getElementById('tablesRoot');

  // ---------- Render dispatch ----------
  function render(){
    updateNav();
    if(state.view==='calendar') renderCalendar();
    else if(state.view==='tables') renderTables();
    else renderMetrics();
    syncUrlState();
  }

  function updateNav(){
    document.getElementById('tabCalendar').classList.toggle('active', state.view==='calendar');
    document.getElementById('tabTables').classList.toggle('active', state.view==='tables');
    document.getElementById('tabMetrics').classList.toggle('active', state.view==='metrics');
    var d = new Date(state.currentMonth.year, state.currentMonth.month, 1);
    monthLabel.textContent = d.toLocaleDateString('en-US', {month:'long', year:'numeric'});
    calendarRoot.classList.toggle('hidden', state.view!=='calendar');
    tablesRoot.classList.toggle('hidden', state.view!=='tables');
    metricsRoot.classList.toggle('hidden', state.view!=='metrics');
  }

  // ---------- Calendar ----------
  function buildMonthGrid(year, month){
    var first = new Date(year, month, 1);
    var startWeekday = (first.getDay() + 6) % 7; // Monday = 0
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var daysInPrevMonth = new Date(year, month, 0).getDate();
    var cells = [];
    for(var i=0;i<startWeekday;i++){
      var num = daysInPrevMonth - startWeekday + 1 + i;
      cells.push({ date: new Date(year, month-1, num), otherMonth:true, num:num });
    }
    for(var d=1; d<=daysInMonth; d++){
      cells.push({ date: new Date(year, month, d), otherMonth:false, num:d });
    }
    var trailingDays = (7 - (cells.length % 7)) % 7;
    for(var t=1; t<=trailingDays; t++){
      cells.push({ date: new Date(year, month+1, t), otherMonth:true, num:t });
    }
    return cells;
  }

  function renderCalendar(){
    var cells = buildMonthGrid(state.currentMonth.year, state.currentMonth.month);
    var todayStr = formatDate(new Date());
    var weekdayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    var weekdaysHtml = weekdayNames.map(function(w){ return '<div class="cal-weekday">'+w+'</div>'; }).join('');

    var cellsHtml = cells.map(function(cell){
      var dateStr = formatDate(cell.date);
      var isToday = dateStr === todayStr;
      var dayPosts = cell.otherMonth ? [] : state.posts.filter(function(p){ return p.date===dateStr; }).sort(function(a,b){ return (a.time||'99:99').localeCompare(b.time||'99:99'); });
      var groups=[];
      PLATFORMS.forEach(function(plat){
        var posts=dayPosts.filter(function(p){return p.platform===plat.key;});
        if(!posts.length) return;
        var items=posts.map(function(p){
          var title=truncate(getPreview(p),80);
          var meta=prettyDateShort(p.date)+(p.time?' · '+p.time:'');
          var type=p.contentType?'<span class="cal-preview-type">'+escapeHtml(p.contentType)+'</span>':'';
          return '<button type="button" class="cal-preview-item" draggable="true" data-action="jump-table" data-drag-post="'+p.id+'" data-id="'+p.id+'" data-platform="'+p.platform+'">'+
            '<div class="cal-preview-meta"><span>'+escapeHtml(meta)+'</span>'+type+'</div>'+
            '<div class="cal-preview-post-title">'+escapeHtml(title)+'</div>'+
          '</button>';
        }).join('');
        groups.push('<div class="cal-platform-group" data-platform-group="'+plat.key+'">'+
          '<button type="button" class="cal-platform-btn" data-action="calendar-platform" data-platform="'+plat.key+'" data-date="'+dateStr+'" title="View '+escapeHtml(plat.name)+' posts">'+
            platformIcon(plat.key)+'<span>'+escapeHtml(plat.name)+'</span><span class="platform-count">'+posts.length+'</span>'+
          '</button>'+
          '<div class="cal-preview"><div class="cal-preview-title">'+escapeHtml(plat.name)+' · '+posts.length+' post'+(posts.length===1?'':'s')+'</div>'+items+'</div>'+
        '</div>');
      });

      var classes = 'cal-cell' + (cell.otherMonth?' cal-cell-dim':'') + (isToday?' cal-cell-today':'');
      return '<div class="'+classes+'" tabindex="0" data-action="day" data-date="'+dateStr+'">'+
        '<div class="cal-cell-head"><span class="cal-cell-num">'+cell.num+'</span></div>'+
        '<div class="cal-chip-list">'+groups.join('')+'</div>'+
      '</div>';
    }).join('');

    var numRows = cells.length / 7;
    var hint = state.posts.length===0 ? '<div class="hint-bar">Nothing planned yet. Click Add Post, or click any day to add one there.</div>' : '';
    calendarRoot.innerHTML = hint + '<div class="cal-weekdays">'+weekdaysHtml+'</div><div class="cal-grid" style="grid-template-rows:repeat('+numRows+',1fr)">'+cellsHtml+'</div>';
  }

  function navMonth(delta){
    var m = state.currentMonth.month + delta;
    var y = state.currentMonth.year;
    if(m<0){ m=11; y-=1; }
    else if(m>11){ m=0; y+=1; }
    state.currentMonth = { year:y, month:m };
    state.view = 'calendar';
    render();
  }
  function goToday(){
    var t = new Date();
    state.currentMonth = { year:t.getFullYear(), month:t.getMonth() };
    state.view = 'calendar';
    render();
  }

  // ---------- Detail panel ----------
  function openDetailPanel(dateStr, highlightId){
    var posts = state.posts.filter(function(p){ return p.date===dateStr; });
    var status = getStatus(dateStr);

    var itemsHtml = posts.length ? posts.map(function(p){
      var plat = platform(p.platform);
      var fieldsHtml = schemaFor(p.platform).map(function(f){
        var val = p[f.key];
        if(!val) return '';
        return '<div class="detail-field"><b>'+f.label+':</b> '+escapeHtml(val)+'</div>';
      }).join('');
      var metricsHtml = '';
      if(p.metricsUpdatedAt){
        var parts = METRIC_FIELDS.filter(function(m){ return p.metrics && p.metrics[m.key]!==null && p.metrics[m.key]!==undefined; })
          .map(function(m){ return m.label+': '+p.metrics[m.key]; });
        if(parts.length) metricsHtml = '<div class="detail-field" style="color:var(--muted)">'+parts.join(' \u00b7 ')+' (updated '+relativeTime(p.metricsUpdatedAt)+')</div>';
      }
      var highlightStyle = (highlightId && p.id===highlightId) ? ' style="border-color:var(--ink)"' : '';
      return '<div class="detail-item"'+highlightStyle+'>'+

        fieldsHtml + metricsHtml +

      '<div class="panel" role="dialog" aria-modal="true">'+

  // ---------- Tables ----------
  function tableFilteredPosts(){
    var search=String(state.tableSearch||'').trim().toLowerCase();
    var platformFilter=state.currentTableTab||'all';
    var typeFilter=state.tableContentType||'all';
    var statusFilter=state.tableStatus||'all';
    var posts=state.posts.filter(function(p){
      if(platformFilter!=='all' && p.platform!==platformFilter) return false;
      if(typeFilter!=='all' && String(p.contentType||'')!==typeFilter) return false;
      if(statusFilter!=='all' && getStatus(p.date)!==statusFilter) return false;
      if(search){
        var fields=schemaFor(p.platform).map(function(f){return p[f.key]||'';}).join(' ');
        var hay=(p.platform+' '+(p.contentType||'')+' '+fields+' '+getPreview(p)).toLowerCase();
        if(hay.indexOf(search)===-1) return false;
      }
      return true;
    });
    var sort=state.tableSort||'date', dir=state.tableSortDir==='desc'?-1:1;
    posts.sort(function(a,b){
      var av,bv;
      if(sort==='views'||sort==='likes'||sort==='comments'){av=metricNumber(a,sort);bv=metricNumber(b,sort);return (av-bv)*dir;}
      if(sort==='platform'){av=platform(a.platform).name;bv=platform(b.platform).name;return av.localeCompare(bv)*dir;}
      if(sort==='contentType'){av=a.contentType||'';bv=b.contentType||'';return av.localeCompare(bv)*dir;}
      av=(a.date||'')+' '+(a.time||'99:99'); bv=(b.date||'')+' '+(b.time||'99:99');
      return av.localeCompare(bv)*dir;
    });
    return posts;
  }

  function tableTypeOptions(posts){
    var seen={all:true}, vals=['all'];
    posts.forEach(function(p){var t=String(p.contentType||'').trim();if(t&&!seen[t]){seen[t]=true;vals.push(t);}});
    return vals.map(function(v){return '<option value="'+escapeHtml(v)+'" '+(state.tableContentType===v?'selected':'')+'>'+escapeHtml(v==='all'?'All content types':v)+'</option>';}).join('');
  }

      '<select id="tableSort" aria-label="Sort posts"><option value="date" '+(state.tableSort==='date'?'selected':'')+'>Sort: Date</option><option value="views" '+(state.tableSort==='views'?'selected':'')+'>Sort: Views</option><option value="likes" '+(state.tableSort==='likes'?'selected':'')+'>Sort: Likes</option><option value="comments" '+(state.tableSort==='comments'?'selected':'')+'>Sort: Comments</option><option value="platform" '+(state.tableSort==='platform'?'selected':'')+'>Sort: Platform</option><option value="contentType" '+(state.tableSort==='contentType'?'selected':'')+'>Sort: Content type</option></select>'+
      '<button type="button" class="btn-secondary btn-mini" data-action="sort-direction">'+(state.tableSortDir==='desc'?'Descending':'Ascending')+'</button>'+

    var title=state.currentTableTab==='all'?'All Platforms':platform(state.currentTableTab).name;
    var header='<div class="table-toolbar"><div><h2 class="table-title">'+(state.currentTableTab==='all'?'':platformIcon(state.currentTableTab))+escapeHtml(title)+'</h2><div class="table-subtitle">'+posts.length+' matching item'+(posts.length===1?'':'s')+' · Click any row to view the complete post</div></div><div class="table-tabs">'+tabsHtml+'</div></div>'+filterHtml+selectionHtml;

        return '<tr id="table-row-'+escapeHtml(p.id)+'" data-post-row="'+escapeHtml(p.id)+'" class="'+(selected?'selected-row':'')+'">'+checkbox+
          '<td>'+platformIcon(p.platform)+escapeHtml(platform(p.platform).name)+'</td><td>'+prettyDateShort(p.date)+'</td><td>'+escapeHtml(p.time||'—')+'</td><td><span class="status-badge status-'+status+'">'+(status==='posted'?'Posted':'Scheduled')+'</span></td><td>'+escapeHtml(p.contentType||'—')+'</td><td><div class="table-cell-preview" title="'+escapeHtml(getPreview(p))+'">'+escapeHtml(truncate(getPreview(p),90))+'</div></td><td>'+metricNumber(p,'views')+'</td><td>'+metricNumber(p,'likes')+'</td><td>'+metricNumber(p,'comments')+'</td><td>'+relativeTime(p.metricsUpdatedAt)+'</td><td data-row-control="true"><button type="button" class="btn-secondary" data-action="edit-post" data-id="'+escapeHtml(p.id)+'">Edit</button></td></tr>';

      tablesRoot.innerHTML=header+'<div class="table-wrap"><table class="data-table data-table-all"><thead><tr>'+(state.selectionMode?'<th></th>':'')+'<th>Platform</th><th>Date</th><th>Time</th><th>Status</th><th>Type</th><th>Content</th><th>Views</th><th>Likes</th><th>Comments</th><th>Metrics updated</th><th></th></tr></thead><tbody>'+rowsHtml+empty+'</tbody></table></div>';
      return;
    }
    var schema=schemaFor(state.currentTableTab), headFields=schema.map(function(f){return '<th>'+escapeHtml(f.label)+'</th>';}).join(''), headMetrics=METRIC_FIELDS.map(function(m){return '<th>'+escapeHtml(m.label)+'</th>';}).join('');
    rowsHtml=posts.map(function(p){
      var status=getStatus(p.date), selected=!!state.selectedPosts[p.id];
      var checkbox=state.selectionMode ? '<td style="width:38px" data-row-control="true"><input class="select-post" type="checkbox" data-action="select-post" data-id="'+escapeHtml(p.id)+'" '+(selected?'checked':'')+' aria-label="Select post"></td>' : '';
      var fieldCells=schema.map(function(f){var val=p[f.key]||'—';return '<td class="table-cell-'+escapeHtml(f.key)+'"><div class="table-cell-preview" title="'+escapeHtml(val)+'">'+escapeHtml(val)+'</div></td>';}).join('');
      var metricCells=METRIC_FIELDS.map(function(m){var v=p.metrics&&(p.metrics[m.key]!==null&&p.metrics[m.key]!==undefined)?p.metrics[m.key]:'—';return '<td>'+v+'</td>';}).join('');
      return '<tr id="table-row-'+escapeHtml(p.id)+'" data-post-row="'+escapeHtml(p.id)+'" class="'+(selected?'selected-row':'')+'">'+checkbox+'<td>'+prettyDateShort(p.date)+'</td><td>'+escapeHtml(p.time||'—')+'</td><td><span class="status-badge status-'+status+'">'+(status==='posted'?'Posted':'Scheduled')+'</span></td>'+fieldCells+metricCells+'<td>'+relativeTime(p.metricsUpdatedAt)+'</td><td data-row-control="true"><button type="button" class="btn-secondary" data-action="edit-post" data-id="'+escapeHtml(p.id)+'">Edit</button></td></tr>';
    }).join('');
    var colCount=(state.selectionMode?1:0)+3+schema.length+METRIC_FIELDS.length+2;

  // ---------- Metrics ----------
  function metricNumber(post, key){
    var v=post && post.metrics ? Number(post.metrics[key]) : 0;
    return Number.isFinite(v) ? v : 0;
  }
  function metricSummary(pool){
    var views=0, likes=0, comments=0;
    pool.forEach(function(p){ views+=metricNumber(p,'views'); likes+=metricNumber(p,'likes'); comments+=metricNumber(p,'comments'); });
    return {count:pool.length,views:views,likes:likes,comments:comments,avgViews:pool.length?views/pool.length:0,engagement:views?((likes+comments)/views)*100:0};
  }
  function formatMetric(n){
    n=Number(n)||0;
    var abs=Math.abs(n);
    if(abs>=1000000) return (n/1000000).toFixed(abs>=10000000?0:1)+'M';
    if(abs>=1000) return (n/1000).toFixed(abs>=100000?0:1)+'K';
    return Math.round(n).toLocaleString();
  }
  function metricsKpis(summary){
    return '<div class="kpi-grid">'+
      '<div class="kpi-card"><div class="kpi-label">Posts</div><div class="kpi-value">'+formatMetric(summary.count)+'</div><div class="kpi-sub">scheduled / published</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Views</div><div class="kpi-value">'+formatMetric(summary.views)+'</div><div class="kpi-sub">total recorded</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Likes</div><div class="kpi-value">'+formatMetric(summary.likes)+'</div><div class="kpi-sub">total recorded</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Comments</div><div class="kpi-value">'+formatMetric(summary.comments)+'</div><div class="kpi-sub">total recorded</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Avg views / post</div><div class="kpi-value">'+formatMetric(summary.avgViews)+'</div><div class="kpi-sub">based on recorded views</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Engagement</div><div class="kpi-value">'+summary.engagement.toFixed(2)+'%</div><div class="kpi-sub">(likes + comments) / views</div></div>'+
    '</div>';
  }
  function metricsTabsHtml(){
    var html='<div class="metrics-tabs">';
    html+='<button type="button" class="metrics-tab '+(state.metricsTab==='all'?'active':'')+'" data-action="metrics-tab" data-platform="all">Overview</button>';
    PLATFORMS.forEach(function(p){ html+='<button type="button" class="metrics-tab '+(state.metricsTab===p.key?'active':'')+'" data-action="metrics-tab" data-platform="'+p.key+'">'+platformIcon(p.key)+'<span>'+escapeHtml(p.name)+'</span></button>'; });
    return html+'</div>';
  }
  function metricBarChart(items, valueKey, percentMode){
    var max=Math.max(1,Math.max.apply(null,items.map(function(x){return Number(x[valueKey])||0;})));
    return '<div class="metric-chart-bars">'+items.map(function(x){
      var v=Number(x[valueKey])||0, pct=(v/max)*100, p=platform(x.key);
      return '<div class="metric-bar-row"><div class="metric-bar-label">'+platformIcon(x.key)+'<span>'+escapeHtml(p.name)+'</span></div><div class="metric-bar-track"><div class="metric-bar-fill" style="width:'+Math.max(v?2:0,pct)+'%;background:'+p.shade+'"></div></div><div class="metric-bar-value">'+(percentMode?v.toFixed(2)+'%':formatMetric(v))+'</div></div>';
    }).join('')+'</div>';
  }
  function contentTypeChart(pool){
    var counts={}; pool.forEach(function(p){var t=p.contentType||'Other'; counts[t]=(counts[t]||0)+1;});
    var items=Object.keys(counts).map(function(k){return {label:k,value:counts[k]};}).sort(function(a,b){return b.value-a.value;}).slice(0,8);
    if(!items.length) return '<div class="empty-metrics">No content-type data yet.</div>';
    var max=Math.max(1,Math.max.apply(null,items.map(function(x){return x.value;})));
    return '<div class="metric-chart-bars">'+items.map(function(x){return '<div class="metric-bar-row"><div class="metric-bar-label"><span>'+escapeHtml(x.label)+'</span></div><div class="metric-bar-track"><div class="metric-bar-fill" style="width:'+(x.value/max*100)+'%;background:var(--ink)"></div></div><div class="metric-bar-value">'+x.value+'</div></div>';}).join('')+'</div>';
  }
  function donutChart(items){
    var total=items.reduce(function(a,x){return a+x.value;},0);
    if(!total) return '<div class="empty-metrics">No posts yet.</div>';
    var angle=0, stops=[];
    items.forEach(function(x){var p=platform(x.key), next=angle+(x.value/total*360); stops.push(p.shade+' '+angle+'deg '+next+'deg'); angle=next;});
    return '<div class="donut-layout"><div class="donut" style="background:conic-gradient('+stops.join(',')+')"><div class="donut-center"><strong>'+formatMetric(total)+'</strong><span>posts</span></div></div><div class="donut-legend">'+items.map(function(x){var p=platform(x.key);return '<div class="legend-item"><i class="legend-dot" style="background:'+p.shade+'"></i><b>'+escapeHtml(p.name)+'</b><span>'+x.value+'</span></div>';}).join('')+'</div></div>';
  }
  function viewsTrendChart(pool){
    var byDate={}; pool.forEach(function(p){var d=p.date||'Unknown'; if(d!=='Unknown') byDate[d]=(byDate[d]||0)+metricNumber(p,'views');});
    var dates=Object.keys(byDate).sort();
    if(!dates.length) return '<div class="empty-metrics">No dated view data yet.</div>';
    if(dates.length>31) dates=dates.slice(-31);
    var vals=dates.map(function(d){return byDate[d];}), max=Math.max(1,Math.max.apply(null,vals));
    var W=760,H=220,L=34,R=16,T=18,B=30,innerW=W-L-R,innerH=H-T-B;
    var points=vals.map(function(v,i){var x=L+(dates.length===1?innerW/2:i*(innerW/(dates.length-1)));var y=T+innerH-(v/max*innerH);return [x,y];});
    var poly=points.map(function(pt){return pt[0].toFixed(1)+','+pt[1].toFixed(1);}).join(' ');
    var grids=[0,.5,1].map(function(r){var y=T+innerH*r;return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="trend-grid"/>';}).join('');
    var labels='';
    [0,Math.floor((dates.length-1)/2),dates.length-1].forEach(function(i){if(i<0)return;var pt=points[i];labels+='<text x="'+pt[0]+'" y="'+(H-9)+'" text-anchor="middle" class="trend-label">'+escapeHtml(prettyDateShort(dates[i]))+'</text>';});
    var dots=points.map(function(pt){return '<circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="3" class="trend-dot"/>';}).join('');
    return '<div class="trend-wrap"><svg viewBox="0 0 '+W+' '+H+'" class="trend-svg" role="img" aria-label="Views over time">'+grids+'<polyline points="'+poly+'" class="trend-line"/>'+dots+labels+'</svg></div>';
  }
  function weekdayChart(pool){
    var names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], counts=[0,0,0,0,0,0,0];
    pool.forEach(function(p){if(!p.date)return;var a=p.date.split('-');var d=new Date(Number(a[0]),Number(a[1])-1,Number(a[2]));var idx=(d.getDay()+6)%7;counts[idx]++;});
    var max=Math.max(1,Math.max.apply(null,counts));
    return '<div class="weekday-grid">'+names.map(function(n,i){return '<div class="weekday-col"><span class="weekday-value">'+counts[i]+'</span><div class="weekday-track"><div class="weekday-fill" style="height:'+(counts[i]/max*100)+'%"></div></div><span class="weekday-name">'+n+'</span></div>';}).join('')+'</div>';
  }
  function topPostsHtml(pool){
    var list=pool.slice().sort(function(a,b){return metricNumber(b,'views')-metricNumber(a,'views');}).slice(0,5);
    if(!list.length) return '<div class="empty-metrics">No posts available.</div>';
    return '<div class="top-posts">'+list.map(function(p,i){var pl=platform(p.platform);return '<div class="top-post"><div class="top-post-rank">'+(i+1)+'</div><div class="top-post-main"><div class="top-post-title">'+escapeHtml(truncate(getPreview(p),75))+'</div><div class="top-post-meta">'+platformIcon(p.platform)+'<span>'+escapeHtml(pl.name)+'</span><span>·</span><span>'+escapeHtml(prettyDateShort(p.date))+(p.time?' · '+escapeHtml(p.time):'')+'</span></div></div><div class="top-post-metric">'+formatMetric(metricNumber(p,'views'))+' views</div></div>';}).join('')+'</div>';
  }
  function renderMetricsOverview(pool){
    var stats=PLATFORMS.map(function(p){var ps=pool.filter(function(x){return x.platform===p.key;}), s=metricSummary(ps);return {key:p.key,posts:s.count,views:s.views,engagement:s.engagement};});
    var summary=metricSummary(pool);
    return metricsKpis(summary)+
      '<div class="metrics-grid"><div class="chart-card"><h3>Views by platform</h3><div class="chart-subtitle">Total recorded views</div>'+metricBarChart(stats,'views',false)+'</div><div class="chart-card"><h3>Engagement rate</h3><div class="chart-subtitle">Likes + comments divided by views</div>'+metricBarChart(stats,'engagement',true)+'</div></div>'+ 
      '<div class="metrics-grid equal"><div class="chart-card"><h3>Content volume</h3><div class="chart-subtitle">Posts currently in the planner</div>'+donutChart(stats.map(function(x){return {key:x.key,value:x.posts};}))+'</div><div class="chart-card"><h3>Posts by platform</h3><div class="chart-subtitle">Count of scheduled / published items</div>'+metricBarChart(stats,'posts',false)+'</div></div>'+ 
      '<div class="metrics-grid equal"><div class="chart-card"><h3>Top posts</h3><div class="chart-subtitle">Highest recorded views</div>'+topPostsHtml(pool)+'</div><div class="chart-card"><h3>Publishing activity</h3><div class="chart-subtitle">Posts by day of week</div>'+weekdayChart(pool)+'</div></div>';
  }
  function renderMetricsPlatform(key,pool){
    var pl=platform(key), summary=metricSummary(pool);

    var engagementByType={};

    var engItems=Object.keys(engagementByType).map(function(t){var x=engagementByType[t];return {label:t,value:x.views?((x.likes+x.comments)/x.views*100):0};}).sort(function(a,b){return b.value-a.value;}).slice(0,8);

      '<div class="metrics-grid equal"><div class="chart-card"><h3>Engagement by content type</h3><div class="chart-subtitle">Rate based on recorded views</div>'+(engItems.length?engChart:'<div class="empty-metrics">No engagement data yet.</div>')+'</div><div class="chart-card"><h3>Publishing activity</h3><div class="chart-subtitle">Posts by day of week</div>'+weekdayChart(pool)+'</div></div>'+ 
      '<div class="chart-card"><h3>Top '+escapeHtml(pl.name)+' posts</h3><div class="chart-subtitle">Highest recorded views</div>'+topPostsHtml(pool)+'</div>';

  function renderPerformanceAnalysis(pool){
    if(!pool.length) return '<div class="empty-metrics">No posts available for analysis.</div>';
    var metric=state.analysisMetric || 'views', dim=state.analysisDimension || 'contentType';
    function val(p){var m=p.metrics||{};var v=Number(m[metric]);return Number.isFinite(v)?v:0;}
    function engagement(p){var m=p.metrics||{};var v=Number(m.views)||0;return v?((Number(m.likes)||0)+(Number(m.comments)||0))/v*100:0;}
    var groups={};
    pool.forEach(function(p){var k=dim==='contentType'?(p.contentType||'Other'):platform(p.platform).name;if(!groups[k])groups[k]=[];groups[k].push(p);});
    var rows=Object.keys(groups).map(function(k){var a=groups[k], total=a.reduce(function(s,p){return s+val(p);},0), er=a.reduce(function(s,p){return s+engagement(p);},0)/a.length;return {key:k,count:a.length,total:total,avg:total/a.length,eng:er};}).sort(function(a,b){return b.avg-a.avg;});
    var best=rows[0], worst=rows[rows.length-1];

      '<div class="analysis-grid"><div class="analysis-card"><span>Best average</span><strong>'+escapeHtml(best.key)+'</strong></div><div class="analysis-card"><span>Highest average</span><strong>'+formatMetric(best.avg)+'</strong></div><div class="analysis-card"><span>Lowest average</span><strong>'+escapeHtml(worst.key)+'</strong></div></div>'+
      '<div class="chart-card"><h3>Performance breakdown</h3><div class="chart-subtitle">Average results per post. This makes content formats/platforms easier to compare.</div><table class="analysis-table"><thead><tr><th>Group</th><th>Posts</th><th>Average</th><th>Total</th><th>Engagement</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td>'+escapeHtml(r.key)+'</td><td class="num">'+r.count+'</td><td class="num">'+formatMetric(r.avg)+'</td><td class="num">'+formatMetric(r.total)+'</td><td class="num">'+r.eng.toFixed(2)+'%</td></tr>';}).join('')+'</tbody></table></div>';
  }

  function metricsChanged(oldMetrics, newMetrics){
    var a = oldMetrics || {};
    for(var i=0;i<METRIC_FIELDS.length;i++){
      var k = METRIC_FIELDS[i].key;
      var av = (a[k]===undefined) ? null : a[k];
      var bv = (newMetrics[k]===undefined) ? null : newMetrics[k];
      if(av !== bv) return true;
    }
    return false;
  }

  function saveModal(){
    syncModalFromDom();

    });

    var existing = modalState.id ? state.posts.find(function(p){ return p.id===modalState.id; }) : null;
    var oldMetrics = existing ? existing.metrics : null;
    var changed = metricsChanged(oldMetrics, newMetrics);
    var metricsUpdatedAt = changed ? Date.now() : (existing ? existing.metricsUpdatedAt : null);

    var payload = Object.assign({ platform: modalState.platform, date: modalState.date, time: modalState.time || '' }, modalState.fields, {
      metrics: newMetrics,
      metricsUpdatedAt: metricsUpdatedAt
    });

    pushHistory();

    } else {
      Store.add(payload);
